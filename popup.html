<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="popup.css" />
  <title>Axiom Translator</title>
</head>
<body>
  <div class="app">
    <!-- Header / branding -->
    <header class="head">
      <div class="brand">
        <div class="logo">A</div>
        <div class="brand-text">
          <h1>Axiom Translator</h1>
          <p class="status" id="status"></p>
        </div>
      </div>
      <a id="telegram" class="tg-btn" title="Telegram" target="_blank" rel="noopener noreferrer">
        <svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true">
          <path fill="currentColor" d="M9.78 15.6l-.4 4.02c.57 0 .82-.24 1.12-.53l2.7-2.56 5.6 4.1c1.02.56 1.75.27 2.02-.95L23.9 4.7c.35-1.6-.58-2.23-1.58-1.86L2.2 10.6c-1.56.6-1.54 1.47-.27 1.86l5.03 1.57L18.6 6.9c.55-.36 1.05-.16.64.2z"/>
        </svg>
      </a>
    </header>

    <!-- Master switch + link preservation -->
    <section class="card">
      <div class="row toggle-row" data-toggle="enabled">
        <div class="row-label">
          <span class="row-title" data-i18n="enabledTitle">Translator</span>
          <span class="row-sub" data-i18n="enabledSub">Automatically translate posts</span>
        </div>
        <span class="switch"><span class="knob"></span></span>
      </div>
      <div class="sep"></div>
      <div class="row toggle-row" data-toggle="preserveLinks">
        <div class="row-label">
          <span class="row-title" data-i18n="preserveTitle">Preserve original links</span>
          <span class="row-sub" data-i18n="preserveSub">Keep real hrefs as clickable links</span>
        </div>
        <span class="switch"><span class="knob"></span></span>
      </div>
    </section>

    <!-- Language -->
    <section class="card">
      <div class="seg-block">
        <span class="seg-title" data-i18n="language">Language</span>
        <div class="seg" data-setting="uiLang">
          <button data-value="en">EN</button>
          <button data-value="ru">RU</button>
        </div>
      </div>
    </section>
  </div>

  <script src="popup.js"></script>
</body>
</html>
